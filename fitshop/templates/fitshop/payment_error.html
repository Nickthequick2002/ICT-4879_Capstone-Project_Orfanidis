{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payment Error - FitTrack</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background-color: #f8f9fa;">

    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="alert alert-danger shadow p-5 text-center" role="alert" style="max-width: 600px; width: 100%; border-radius: 20px; background-color: #fff; border: 1px solid #f5c6cb;">
            <div class="mb-4">
                <i class="fa fa-exclamation-circle text-danger" style="font-size: 4rem;"></i>
            </div>
            <h2 class="alert-heading fw-bold mb-3 text-danger">Payment Verification Failed</h2>
            <p class="lead mb-4 fw-normal">{{ message }}</p>
            <hr class="my-4">
            <p class="mb-4 text-muted">We could not verify your payment with PayPal. No charges were made to your account within our system.</p>
            <a href="{% url 'fitshop' %}" class="btn btn-danger rounded-pill px-5 py-3 fw-bold text-uppercase" style="letter-spacing: 1px;">Return to Shop</a>
        </div>
    </div>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
