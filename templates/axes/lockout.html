{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Account Locked - FitTrack</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background-color: #f8f9fa;">

    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow text-center p-5" style="max-width: 500px; border-radius: 20px; border: none;">
            <div class="mb-4">
                <i class="fa fa-lock" style="font-size: 5rem; color: #ff8c42;"></i>
            </div>
            <h2 class="fw-bold mb-3 text-dark">Too Many Attempts</h2>
            <p class="text-muted mb-4">
                We've detected too many failed login attempts from your IP address. 
                For security reasons, your access has been temporarily locked.
            </p>
            
            <p class="text-muted mb-4" id="countdown-message" style="font-size: 1.1rem;">
                Please try again in <span id="timer" style="font-weight: bold; color: #ff8c42;">05:00</span>
            </p>

            <a href="{% url 'home' %}" class="btn btn-outline-brand-orange bordered rounded-pill px-5 py-2 fw-bold mt-3">Return to Home</a>
        </div>
    </div>

    <script>
        // Simple 5-minute countdown
        let time = 5 * 60; // 5 minutes in seconds
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            const minutes = Math.floor(time / 60);
            let seconds = time % 60;
            
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            timerElement.textContent = `0${minutes}:${seconds}`; // Ensure 05:00 format
            
            if (time <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "00:00";
                // Update message to indicate they can retry
                document.getElementById('countdown-message').innerHTML = "You can try logging in again now.";
            } else {
                time--;
            }
        }, 1000);
    </script>
        </div>
    </div>

</body>
</html>
